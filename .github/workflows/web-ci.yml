name: Web CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: web-ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Vérifier et construire le site
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier la syntaxe JavaScript
        run: npm run check:js

      - name: Construire le dossier public www
        run: npm run build

      - name: Vérifier les pages produites
        shell: bash
        run: |
          test "$(find www -maxdepth 1 -name '*.html' | wc -l)" -eq 9
          test -f www/index.html
          test -f www/assets/css/style.css
          test -f www/assets/js/main.js
          test -f www/assets/js/native-bridge.js

      - name: Publier le build web en artefact de contrôle
        uses: actions/upload-artifact@v4
        with:
          name: touvoir-web-build
          path: www/
          if-no-files-found: error
