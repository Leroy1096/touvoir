name: Android

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:
    branches: [main]
  workflow_dispatch:
    inputs:
      build_release:
        description: "Construire aussi l'APK/AAB release signé"
        required: false
        default: false
        type: boolean

concurrency:
  group: Android-${{ github.ref }}
  cancel-in-progress: true

jobs:
  debug:
    name: Build APK debug
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: Gradle

      - name: Installer le SDK Android 36
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Installer les dépendances
        run: npm ci

      - name: Vérifier le JavaScript
        run: npm run check:js

      - name: Construire le web et synchroniser Capacitor
        run: npx cap sync android

      - name: Compiler l'APK debug
        working-directory: android
        run: ./gradlew assembleDebug --stacktrace

      - name: Publier l'APK debug en artefact
        uses: actions/upload-artifact@v4
        with:
          name: touvoir-Android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

  release:
    name: Build et publication release
    if: startsWith(github.ref, 'refs/tags/v') || (github.event_name == 'workflow_dispatch' && inputs.build_release)
    needs: debug
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
    env:
      ANDROID_KEYSTORE_BASE64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      ANDROID_KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      ANDROID_KEY_ALIAS: ${{ secrets.ANDROID_KEY_ALIAS }}
      ANDROID_KEY_PASSWORD: ${{ secrets.ANDROID_KEY_PASSWORD }}
    steps:
      - name: Récupérer le code
        uses: actions/checkout@v4

      - name: Vérifier les secrets de signature
        shell: bash
        run: |
          missing=0
          for name in ANDROID_KEYSTORE_BASE64 ANDROID_KEYSTORE_PASSWORD ANDROID_KEY_ALIAS ANDROID_KEY_PASSWORD; do
            if [ -z "${!name:-}" ]; then
              echo "::error::Secret GitHub manquant : $name"
              missing=1
            fi
          done
          exit "$missing"

      - name: Installer Node.js 22
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Installer Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
          cache: Gradle

      - name: Installer le SDK Android 36
        shell: bash
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses >/dev/null || true
          "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platform-tools" "platforms;android-36" "build-tools;36.0.0"

      - name: Installer les dépendances
        run: npm ci

      - name: Préparer le keystore temporaire
        shell: bash
        run: |
          keystore_path="$RUNNER_TEMP/touvoir-release.keystore"
          printf '%s' "$ANDROID_KEYSTORE_BASE64" | base64 --decode > "$keystore_path"
          chmod 600 "$keystore_path"
          echo "ANDROID_KEYSTORE_PATH=$keystore_path" >> "$GITHUB_ENV"

      - name: Construire le web et synchroniser Capacitor
        run: npx cap sync android

      - name: Compiler l'APK et l'AAB release signés
        working-directory: android
        run: ./gradlew assembleRelease bundleRelease --stacktrace

      - name: Préparer les fichiers de release
        shell: bash
        run: |
          version="$(node -p "require('./package.json').version")"
          mkdir -p dist-release
          cp android/app/build/outputs/apk/release/app-release.apk "dist-release/TOUVOIR-v${version}.apk"
          cp android/app/build/outputs/bundle/release/app-release.aab "dist-release/TOUVOIR-v${version}.aab"
          (cd dist-release && sha256sum * > SHA256SUMS.txt)

      - name: Publier les artefacts release
        uses: actions/upload-artifact@v4
        with:
          name: touvoir-Android-release
          path: dist-release/
          if-no-files-found: error

      - name: Publier la GitHub Release
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: dist-release/*
          generate_release_notes: true
          fail_on_unmatched_files: true
